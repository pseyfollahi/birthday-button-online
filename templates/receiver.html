<div id="message">در انتظار...</div>

<button id="enableNotifications">

</button>

<script>

    const VAPID_PUBLIC_KEY =
        "BK5J-HXfz8fa-OWVNtZwxguWBaPbMmX0jKIe4XIEnEV7lt31K1DO7Is6pMtMDsXpWW2qjzGhvsMusNbUmlYG0b8";


    function urlBase64ToUint8Array(base64String) {

        const padding =
            "=".repeat(
                (4 - base64String.length % 4) % 4
            );

        const base64 =
            (base64String + padding)
                .replace(/-/g, "+")
                .replace(/_/g, "/");

        const rawData =
            window.atob(base64);

        return Uint8Array.from(
            [...rawData].map(
                char => char.charCodeAt(0)
            )
        );
    }


    /* ---------------------------------
       ارسال Subscription به سرور
    --------------------------------- */

    async function sendSubscriptionToServer(subscription) {

        const response =
            await fetch(
                "/subscribe",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(subscription)
                }
            );


        if (!response.ok) {

            throw new Error(
                "سرور Subscription را قبول نکرد."
            );

        }


        const result =
            await response.json();


        console.log(
            "Server response:",
            result
        );

    }


    /* ---------------------------------
       بررسی Subscription قبلی
    --------------------------------- */

    async function checkExistingSubscription() {

        try {

            if (!("serviceWorker" in navigator)) {
                return;
            }


            if (!("PushManager" in window)) {
                return;
            }


            const registration =
                await navigator.serviceWorker.register(
                    "/sw.js"
                );


            await navigator.serviceWorker.ready;


            const permission =
                Notification.permission;


            console.log(
                "Current notification permission:",
                permission
            );


            /*
             اگر قبلاً اجازه داده شده،
             Subscription قبلی را پیدا کن
            */

            if (permission === "granted") {

                const subscription =
                    await registration.pushManager.getSubscription();


                if (subscription) {

                    console.log(
                        "Existing subscription found."
                    );


                    await sendSubscriptionToServer(
                        subscription
                    );


                    document
                        .getElementById(
                            "enableNotifications"
                        )
                        .style.display =
                        "none";


                    console.log(
                        "Existing subscription restored."
                    );

                }

            }

        } catch (error) {

            console.error(
                "Existing subscription check failed:",
                error
            );

        }

    }


    /* ---------------------------------
       فعال کردن اعلان‌ها
    --------------------------------- */

    async function enableNotifications() {

        try {

            console.log(
                "Starting notification setup..."
            );


            if (!("serviceWorker" in navigator)) {

                throw new Error(
                    "Service Worker پشتیبانی نمی‌شود."
                );

            }


            if (!("PushManager" in window)) {

                throw new Error(
                    "Push API در این مرورگر پشتیبانی نمی‌شود."
                );

            }


            const registration =
                await navigator.serviceWorker.register(
                    "/sw.js"
                );


            await navigator.serviceWorker.ready;


            let permission =
                Notification.permission;


            /*
             فقط اگر هنوز اجازه گرفته نشده،
             درخواست Permission کن
            */

            if (permission === "default") {

                permission =
                    await Notification.requestPermission();

            }


            console.log(
                "Notification permission:",
                permission
            );


            if (permission !== "granted") {

                throw new Error(
                    "اجازه اعلان‌ها داده نشده است."
                );

            }


            let subscription =
                await registration.pushManager.getSubscription();


            /*
             اگر Subscription قبلی وجود نداشت،
             یک Subscription جدید بساز
            */

            if (!subscription) {

                subscription =
                    await registration.pushManager.subscribe({

                        userVisibleOnly: true,

                        applicationServerKey:
                            urlBase64ToUint8Array(
                                VAPID_PUBLIC_KEY
                            )

                    });

            }


            console.log(
                "Push subscription:",
                subscription
            );


            await sendSubscriptionToServer(
                subscription
            );


            document
                .getElementById(
                    "enableNotifications"
                )
                .style.display =
                "none";


            alert(
                "اعلان‌ها فعال شدند ✅"
            );


        } catch (error) {

            console.error(
                "Notification error:",
                error
            );


            alert(
                "خطا:\n" +
                (
                    error.message ||
                    error
                )
            );

        }

    }


    /* ---------------------------------
       دکمه اعلان‌ها
    --------------------------------- */

    document
        .getElementById(
            "enableNotifications"
        )
        .addEventListener(
            "click",
            enableNotifications
        );


    /* ---------------------------------
       بررسی خودکار هنگام باز شدن صفحه
    --------------------------------- */

    checkExistingSubscription();


    /* ---------------------------------
       Socket.IO
    --------------------------------- */

    const socket = io();


    socket.on(
        "birthday_message",
        function (data) {

            document
                .getElementById(
                    "message"
                )
                .innerHTML =
                data.text;

        }
    );

</script>
