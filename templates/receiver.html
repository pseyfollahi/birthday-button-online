<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: white;
            font-family: Tahoma, sans-serif;
        }

        #message {
            font-size: 70px;
            color: green;
            text-align: center;
        }

        #enableNotifications {
            margin-top: 40px;
            padding: 15px 25px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="message">در انتظار...</div>

    <button id="enableNotifications">
        فعال کردن اعلان‌ها
    </button>

    <script>

        const VAPID_PUBLIC_KEY = "BK5J-HXfz8fa-OWVNtZwxguWBaPbMmX0jKIe4XIEnEV7lt31K1DO7Is6pMtMDsXpWW2qjzGhvsMusNbUmlYG0b8";


        function urlBase64ToUint8Array(base64String) {

            const padding =
                "=".repeat(
                    (4 - base64String.length % 4) % 4
                );

            const base64 =
                (base64String + padding)
                    .replace(/-/g, "+")
                    .replace(/_/g, "/");

            const rawData =
                window.atob(base64);

            return Uint8Array.from(
                [...rawData].map(
                    char => char.charCodeAt(0)
                )
            );
        }


        async function enableNotifications() {

            try {

                console.log(
                    "Starting notification setup..."
                );


                if (!("serviceWorker" in navigator)) {

                    throw new Error(
                        "Service Worker پشتیبانی نمی‌شود."
                    );

                }


                const registration =
                    await navigator.serviceWorker.register(
                        "/sw.js"
                    );


                console.log(
                    "Service Worker registered."
                );


                await navigator.serviceWorker.ready;


                if (!("PushManager" in window)) {

                    throw new Error(
                        "Push API در این مرورگر پشتیبانی نمی‌شود."
                    );

                }


                const permission =
                    await Notification.requestPermission();


                console.log(
                    "Notification permission:",
                    permission
                );


                if (permission !== "granted") {

                    throw new Error(
                        "اجازه اعلان‌ها داده نشد."
                    );

                }


                let subscription =
                    await registration.pushManager.getSubscription();


                if (!subscription) {

                    subscription =
                        await registration.pushManager.subscribe({

                            userVisibleOnly: true,

                            applicationServerKey:
                                urlBase64ToUint8Array(
                                    VAPID_PUBLIC_KEY
                                )

                        });

                }


                console.log(
                    "Push subscription:",
                    subscription
                );


                const response =
                    await fetch(
                        "/subscribe",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    subscription
                                )
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "سرور Subscription را قبول نکرد."
                    );

                }


                const result =
                    await response.json();


                console.log(
                    "Server response:",
                    result
                );


                alert(
                    "اعلان‌ها فعال شدند ✅"
                );


            } catch (error) {

                console.error(
                    "Notification error:",
                    error
                );


                alert(
                    "خطا:\n" +
                    (
                        error.message ||
                        error
                    )
                );

            }

        }


        document
            .getElementById(
                "enableNotifications"
            )
            .addEventListener(
                "click",
                enableNotifications
            );


        const socket = io();


        socket.on(
            "birthday_message",
            function (data) {

                document
                    .getElementById(
                        "message"
                    )
                    .innerHTML =
                    data.text;

            }
        );

    </script>

</body>

</html>
